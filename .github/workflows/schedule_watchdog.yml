name: Crypto Schedule Watchdog

on:
  schedule:
    # 21:33 UTC = 05:33 BJT. This is a compensation check, not a replacement
    # for the existing 21:03 UTC daily schedule.
    - cron: "33 21 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: crypto-main-writer
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install watchdog dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Audit schedules and compensate missing daily run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python github_skill/scripts/schedule_watchdog.py

      - name: Commit schedule audit
        shell: bash
        run: |
          if git diff --quiet -- audit/; then
            echo "No schedule audit change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/
          git commit -m "chore: audit crypto schedule health"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1
