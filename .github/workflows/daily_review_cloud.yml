name: Crypto Daily Review (Cloud)

on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Shanghai on the following day.
    # Run five minutes after the top of the hour to reduce scheduled-run congestion.
    - cron: "5 23 * * *"
  workflow_dispatch:

concurrency:
  # This workflow and price_monitor.yml both write main/config state.
  group: crypto-main-writer
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-review:
    runs-on: ubuntu-latest
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
      GENERATOR_COMMAND: python github_skill/scripts/cloud_run.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cloud report dependencies
        run: python -m pip install --disable-pip-version-check -r github_skill/requirements.txt

      - name: Verify generator configuration
        run: |
          test -n "$GENERATOR_COMMAND"
          echo "Generator configured: $GENERATOR_COMMAND"

      - name: Fetch data and build Word review
        run: $GENERATOR_COMMAND

      - name: Commit report and active conditions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.docx reports/*.html reports/index.html config/active_conditions.json audit/*.json
          git diff --cached --quiet || git commit -m "chore: publish crypto daily review $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing origin/main before retry."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "Unable to push the daily review after 5 attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy HTML report to Pages
        uses: actions/deploy-pages@v4

      - name: Notify Feishu
        run: |
          report=$(find reports -maxdepth 1 -name 'crypto_macro_daily_*.docx' -type f -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          python github_skill/scripts/send_feishu.py --webhook "$FEISHU_WEBHOOK" --report "$report" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --html-url "https://simondongxiao.github.io/crypto-macro-daily-monitor/"
