name: Crypto Price Monitor to Feishu

on:
  schedule:
    # GitHub cron uses UTC. This runs roughly every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout conditions and monitor
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitor dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Poll Binance and notify Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ACTIVE_CONDITIONS_PATH: config/active_conditions.json
        run: python scripts/price_monitor.py

      - name: Commit alert state if changed
        shell: bash
        run: |
          if git diff --quiet -- config/active_conditions.json; then
            echo "No alert state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/active_conditions.json
          git commit -m "chore: persist crypto price alert state"
          git push
