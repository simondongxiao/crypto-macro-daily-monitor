name: Crypto Price Monitor to Feishu

on:
  schedule:
    # GitHub cron uses UTC. Five minutes is the shortest practical polling
    # interval, but scheduled runs remain best-effort on GitHub-hosted runners.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [crypto_price_monitor_external_trigger]

permissions:
  contents: write

concurrency:
  # The monitor writes alert flags to main. Serialize it with the daily writer.
  group: crypto-main-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout conditions and monitor
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install monitor dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Poll Binance and notify Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ACTIVE_CONDITIONS_PATH: config/active_conditions.json
        run: python scripts/price_monitor.py

      - name: Upload monitor audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-monitor-${{ github.run_id }}
          path: monitor_logs/*.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Commit alert state if changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- config/active_conditions.json; then
            echo "No alert state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/active_conditions.json
          git commit -m "chore: persist crypto price alert state"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing origin/main before retry."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "Git push failed; attempting GitHub Contents API state persistence."
          content=$(base64 -w0 config/active_conditions.json)
          for attempt in 1 2 3; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/config/active_conditions.json?ref=main" --jq '.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              if gh api "repos/$GITHUB_REPOSITORY/contents/config/active_conditions.json" --method PUT -f message="chore: persist crypto price alert state (api fallback)" -f content="$content" -f branch=main -f sha="$sha" >/dev/null; then
                echo "Alert state persisted through GitHub Contents API."
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to persist price alert state after git and API retries."
          exit 1
